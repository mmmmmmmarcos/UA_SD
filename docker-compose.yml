version: '3.8'
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka_sd
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://34.228.44.34:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  central:
    build: .
    container_name: wm_central
    depends_on:
      - kafka
    ports:
      - "8081:8080"
      - "8082:8082"
    command: java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp "src:lib/*" ServidorConcurrente 8080 kafka:29092

  frontend:
    image: nginx:alpine
    container_name: wm_frontend
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

  monitor:
    build: .
    container_name: wm_monitor
    depends_on:
      - central
    ports:
      - "5000:5000"
    command: sh -c "sleep 15 && java -cp src WM_WS_M central:8080 5000 WS-01 ZonaNorte"

  engine:
    build: .
    container_name: wm_engine
    depends_on:
      - monitor
    stdin_open: true
    tty: true
    command: sh -c "sleep 20 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_WS_E 34.228.44.34:9092 monitor:5000 WS-01"

  operario:
    build: .
    container_name: wm_fo
    stdin_open: true
    tty: true
    command: sh -c "sleep 25 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_FO 34.228.44.34:9092 FO-01 MANUAL"