version: '3.8'
services:
  central:
    build: .
    container_name: wm_central
    ports:
      - "8081:8080"
      - "8082:8082"
    command: java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp "src:lib/*" ServidorConcurrente 8080 34.228.44.34:9092

  frontend:
    image: nginx:alpine
    container_name: wm_frontend
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

  monitor:
    build: .
    container_name: wm_monitor
    depends_on:
      - central
    ports:
      - "5000:5000"
    command: sh -c "sleep 15 && java -cp src WM_WS_M central:8080 5000 WS-01 ZonaNorte"

  engine:
    build: .
    container_name: wm_engine
    depends_on:
      - monitor
    stdin_open: true
    tty: true
    command: sh -c "sleep 20 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_WS_E 34.228.44.34:9092 monitor:5000 WS-01"

  operario:
    build: .
    container_name: wm_fo
    stdin_open: true
    tty: true
    command: sh -c "sleep 25 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_FO 34.228.44.34:9092 FO-01 MANUAL"