version: '3.8'
services:
  central:
    build: .
    container_name: wm_central
    ports:
      - "8081:8080"
    command: java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp "src:lib/*" ServidorConcurrente 8080 52.90.18.232:9092

  monitor:
    build: .
    container_name: wm_monitor
    depends_on:
      - central
    ports:
      - "5000:5000"
    command: sh -c "sleep 5 && java -cp src WM_WS_M central:8080 5000"

  engine:
    build: .
    container_name: wm_engine
    depends_on:
      - monitor
    stdin_open: true
    tty: true
    command: sh -c "sleep 8 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_WS_E 52.90.18.232:9092 monitor:5000"

  operario:
    build: .
    container_name: wm_fo
    depends_on:
      - central
    command: sh -c "sleep 12 && java -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -cp 'src:lib/*' WM_FO 52.90.18.232:9092 peticiones.txt"