<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Distribuidos - Panel Water Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        .contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            flex: 1;
            min-width: 300px;
        }

            .panel h2 {
                font-size: 1.1em;
                margin-top: 0;
                color: #34495e;
                border-bottom: 1px solid #eee;
                padding-bottom: 5px;
            }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.9em;
        }

            button:hover {
                background-color: #2980b9;
            }

            button.detener {
                background-color: #e74c3c;
            }

                button.detener:hover {
                    background-color: #c0392b;
                }

        #logConsole {
            width: 100%;
            height: 180px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85em;
            padding: 8px;
            resize: vertical;
        }

        .estado-box {
            padding: 8px;
            background: #eef;
            border-left: 4px solid #3498db;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Water Management - Panel de Control</h1>

    <div class="contenedor">
        <!-- Panel 1: Monitor de Estación -->
        <div class="panel">
            <h2>1. Control de Estaciones (WS_M / WS_E)</h2>
            <div class="campo">
                <label for="estacionSelect">Estación de Riego:</label>
                <select id="estacionSelect">
                    <option value="WS-01">Estación 1 (WS-01)</option>
                    <option value="WS-02">Estación 2 (WS-02)</option>
                    <option value="WS-03">Estación 3 (WS-03)</option>
                </select>
            </div>

            <div class="estado-box">
                Estado: <strong id="txtEstado">Apagado</strong> | Caudal actual: <strong id="txtCaudal">0</strong> L/min
            </div>

            <div class="campo">
                <label for="inputCaudal">Ajustar Caudal (L/min):</label>
                <input type="number" id="inputCaudal" value="15" min="0" max="100" style="width: 100%; padding: 5px;">
            </div>

            <button onclick="cambiarEstado(true)">Iniciar Riego</button>
            <button class="detener" onclick="cambiarEstado(false)">Detener Riego</button>
        </div>

        <!-- Panel 2: Generador de Tramas Red -->
        <div class="panel">
            <h2>2. Generador de Tramas (Sockets / Protocolo)</h2>
            <div class="campo">
                <label for="inputComando">Comando Payload:</label>
                <input type="text" id="inputComando" value="WS-01;START;FLOW=15">
            </div>
            <button onclick="generarTrama()">Generar Trama STX/ETX</button>

            <div class="campo" style="margin-top: 10px;">
                <label>Trama generada con LRC:</label>
                <input type="text" id="resTrama" readonly style="background: #f0f0f0;">
            </div>
        </div>

        <!-- Panel 3: Simulación de Operario FO -->
        <div class="panel">
            <h2>3. Cola de Trabajo (peticiones.txt)</h2>
            <div class="campo">
                <label for="txtPeticiones">Archivo de peticiones pendiente:</label>
                <textarea id="txtPeticiones" rows="4">WS-01 START 20
WS-02 START 15
WS-01 STOP 0</textarea>
            </div>
            <button onclick="procesarSiguientePeticion()">Procesar Siguiente Orden</button>
        </div>
    </div>

    <!-- Log de Eventos -->
    <div style="margin-top: 20px;">
        <h2>Consola de Eventos (Logs del Sistema)</h2>
        <textarea id="logConsole" readonly></textarea>
        <button onclick="limpiarLog()" style="margin-top: 5px; background: #7f8c8d;">Limpiar Consola</button>
    </div>

    <script>
        let riegoActivo = false;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const consoleBox = document.getElementById('logConsole');
            consoleBox.value += `[${time}] ${msg}\n`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function cambiarEstado(activo) {
            riegoActivo = activo;
            const est = document.getElementById('estacionSelect').value;
            const caudal = activo ? document.getElementById('inputCaudal').value : 0;

            document.getElementById('txtEstado').innerText = activo ? "EN RIEGO" : "Apagado";
            document.getElementById('txtEstado').style.color = activo ? "green" : "red";
            document.getElementById('txtCaudal').innerText = caudal;

            log(`[SISTEMA] Estación ${est} -> Estado: ${activo ? 'ACTIVADO' : 'DESACTIVADO'} | Caudal: ${caudal} L/min`);
        }

        function generarTrama() {
            const payload = document.getElementById('inputComando').value;
            if (!payload) return;

            // Calculo básico de checksum XOR (LRC)
            let lrc = 0;
            for (let i = 0; i < payload.length; i++) {
                lrc ^= payload.charCodeAt(i);
            }
            const lrcHex = lrc.toString(16).padStart(2, '0').toUpperCase();

            // Formato de trama con STX (\x02) y ETX (\x03)
            const trama = `<STX>${payload}<ETX>[0x${lrcHex}]`;
            document.getElementById('resTrama').value = trama;

            log(`[SOCKET] Trama enviada: ${trama}`);
        }

        function procesarSiguientePeticion() {
            const area = document.getElementById('txtPeticiones');
            const lineas = area.value.split('\n').filter(l => l.trim() !== '');

            if (lineas.length === 0) {
                log('[WM_FO] No quedan peticiones pendientes en peticiones.txt');
                return;
            }

            const siguiente = lineas.shift();
            area.value = lineas.join('\n');

            log(`[WM_FO] Procesando orden desde peticiones.txt: "${siguiente}"`);
        }

        function limpiarLog() {
            document.getElementById('logConsole').value = '';
        }

        // Mensaje inicial de arranque
        log("[INICIO] Panel de control Water Management iniciado correctamente.");
    </script>
</body>
</html>
