<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Distribuidos - Panel Water Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        .contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            flex: 1;
            min-width: 300px;
        }

            .panel h2 {
                font-size: 1.1em;
                margin-top: 0;
                color: #34495e;
                border-bottom: 1px solid #eee;
                padding-bottom: 5px;
            }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input[type="text"], select, textarea, input[type="number"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.9em;
            margin-right: 5px;
            margin-bottom: 5px;
        }

            button:hover {
                background-color: #2980b9;
            }

            button.detener {
                background-color: #e74c3c;
            }

                button.detener:hover {
                    background-color: #c0392b;
                }

            button.fuga {
                background-color: #f39c12;
            }

                button.fuga:hover {
                    background-color: #e67e22;
                }

        #logConsole {
            width: 100%;
            height: 180px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85em;
            padding: 8px;
            resize: vertical;
        }

        .estado-box {
            padding: 8px;
            background: #eef;
            border-left: 4px solid #3498db;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Water Management - Panel de Control</h1>
    <div class="contenedor">

        <!-- Panel 1: Control de Estaciones -->
        <div class="panel">
            <h2>1. Control de Estaciones (WS_M / WS_E)</h2>
            <div class="campo">
                <label for="estacionSelect">Estación de Riego:</label>
                <select id="estacionSelect">
                    <option value="WS-01">Estación 1 (WS-01)</option>
                    <option value="WS-02">Estación 2 (WS-02)</option>
                    <option value="WS-03">Estación 3 (WS-03)</option>
                </select>
            </div>
            <div class="estado-box">
                Estado: <strong id="txtEstado">Apagado</strong> | Caudal actual: <strong id="txtCaudal">0</strong> L/min
            </div>
            <div class="campo">
                <label for="inputCaudal">Ajustar Segundos de Riego:</label>
                <input type="number" id="inputSegundos" value="5" min="1" max="100">
            </div>
            <button onclick="cambiarEstado(true)">Iniciar Riego</button>
            <button class="detener" onclick="cambiarEstado(false)">Detener Riego</button>
            <button class="fuga" onclick="toggleFuga()">Provocar/Arreglar Fuga</button>
        </div>

        <!-- Panel 2: Cola de Trabajo -->
        <div class="panel">
            <h2>2. Cola de Trabajo (Simulación peticiones.txt)</h2>
            <div class="campo">
                <label for="txtPeticiones">Archivo de peticiones pendiente:</label>
                <textarea id="txtPeticiones" rows="6">WS-01#4
WS-02#6
WS-01#5</textarea>
            </div>
            <button onclick="procesarSiguientePeticion()">Procesar Siguiente Orden</button>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <h2>Consola de Eventos (Logs del Sistema)</h2>
        <textarea id="logConsole" readonly></textarea>
        <button onclick="limpiarLog()" style="margin-top: 5px; background: #7f8c8d;">Limpiar Consola</button>
    </div>

    <script>
        let riegoActivo = false;
        let fugaActiva = false;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const consoleBox = document.getElementById('logConsole');
            consoleBox.value += `[${time}] ${msg}\n`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function mandarFetchCentral(orden) {
            fetch(`http://localhost:8082/regar?orden=${encodeURIComponent(orden)}`)
                .then(response => log(`[HTTP] Orden inyectada a la Central: ${orden}`))
                .catch(err => log(`[ERROR] HTTP: No se alcanzó la Central. ${err}`));
        }

        function cambiarEstado(activo) {
            riegoActivo = activo;
            const est = document.getElementById('estacionSelect').value;
            const segs = activo ? document.getElementById('inputSegundos').value : 0;

            document.getElementById('txtEstado').innerText = activo ? "EN RIEGO" : "Apagado";
            document.getElementById('txtEstado').style.color = activo ? "green" : "red";
            document.getElementById('txtCaudal').innerText = activo ? "15" : "0";

            log(`[SISTEMA] Estación ${est} -> Acción manual disparada.`);

            if (activo) {
                mandarFetchCentral(`${est}#${segs}`);
            } else {
                mandarFetchCentral(`${est}#STOP`);
            }
        }

        function toggleFuga() {
            fugaActiva = !fugaActiva;
            const est = document.getElementById('estacionSelect').value;
            log(`[SISTEMA] Estación ${est} -> Fuga: ${fugaActiva ? 'PROVOCADA' : 'ARREGLADA'}`);

            // Envía un payload especial para la fuga
            mandarFetchCentral(`${est}#FUGA`);
        }

        function procesarSiguientePeticion() {
            const area = document.getElementById('txtPeticiones');
            const lineas = area.value.split('\n').filter(l => l.trim() !== '');
            if (lineas.length === 0) { log('[WM_FO] No hay peticiones.'); return; }

            const siguiente = lineas.shift();
            area.value = lineas.join('\n');
            log(`[WM_FO] Extrayendo orden de la cola: "${siguiente}"`);
            mandarFetchCentral(siguiente);
        }

        function limpiarLog() { document.getElementById('logConsole').value = ''; }
        log("[INICIO] Panel de control iniciado. Listo para inyectar en Kafka.");
    </script>
</body>
</html>
