<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Distribuidos - Panel Water Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }

        .contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            flex: 1;
            min-width: 300px;
        }

            .panel h2 {
                font-size: 1.1em;
                margin-top: 0;
                color: #34495e;
                border-bottom: 1px solid #eee;
                padding-bottom: 5px;
            }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input[type="text"], select, textarea, input[type="number"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.9em;
            margin-right: 5px;
            margin-bottom: 5px;
        }

            button:hover:not(:disabled) {
                background-color: #2980b9;
            }

            button.detener {
                background-color: #e74c3c;
            }

                button.detener:hover:not(:disabled) {
                    background-color: #c0392b;
                }

            button.fuga {
                background-color: #f39c12;
            }

                button.fuga:hover:not(:disabled) {
                    background-color: #e67e22;
                }

            button:disabled {
                background-color: #95a5a6;
                cursor: not-allowed;
            }

        #logConsole {
            width: 100%;
            height: 220px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85em;
            padding: 8px;
            resize: vertical;
        }

        .estado-box {
            padding: 8px;
            background: #eef;
            border-left: 4px solid #3498db;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Water Management - Panel de Control Distribuido</h1>
    <div class="contenedor">

        <div class="panel">
            <h2>1. Control de Estaciones (WS_M / WS_E)</h2>
            <div class="campo">
                <label for="estacionSelect">Estación de Riego:</label>
                <select id="estacionSelect">
                    <option value="WS-01">Estación 1 (WS-01)</option>
                    <option value="WS-02">Estación 2 (WS-02)</option>
                    <option value="WS-03">Estación 3 (WS-03)</option>
                </select>
            </div>
            <div class="estado-box">
                Estado: <strong id="txtEstado">Apagado</strong> | Caudal actual: <strong id="txtCaudal">0</strong> L/min
            </div>
            <div class="campo">
                <label for="inputSegundos">Ajustar Segundos de Riego:</label>
                <input type="number" id="inputSegundos" value="5" min="1" max="100">
            </div>
            <button id="btnIniciar" onclick="cambiarEstado(true)">Iniciar Riego</button>
            <button id="btnDetener" class="detener" onclick="cambiarEstado(false)" disabled>Detener Riego</button>
            <button class="fuga" onclick="toggleFuga()">Provocar/Arreglar Fuga</button>
        </div>

        <div class="panel">
            <h2>2. Cola de Trabajo (Simulación peticiones.txt)</h2>
            <div class="campo">
                <label for="txtPeticiones">Archivo de peticiones pendiente:</label>
                <textarea id="txtPeticiones" rows="6">WS-01#4
WS-02#6
WS-01#5</textarea>
            </div>
            <button onclick="procesarSiguientePeticion()">Procesar Siguiente Orden</button>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <h2>Consola de Eventos Globales (Sincronizada con Kafka AWS)</h2>
        <textarea id="logConsole" readonly></textarea>
        <button onclick="limpiarLog()" style="margin-top: 5px; background: #7f8c8d;">Limpiar Consola</button>
    </div>

    <script>
        let riegoActivo = false;
        let fugaActiva = false;
        let ultimoEventoId = -1;
        let primeraCarga = true;
        let intervaloTimer = null; // El cronómetro absoluto

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const consoleBox = document.getElementById('logConsole');
            consoleBox.value += `[${time}] ${msg}\n`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function actualizarUIEstado(activo, textoEspecial = null) {
            riegoActivo = activo;
            const txtEstado = document.getElementById('txtEstado');
            const txtCaudal = document.getElementById('txtCaudal');

            document.getElementById('btnIniciar').disabled = activo;
            document.getElementById('btnDetener').disabled = !activo;

            if (textoEspecial) {
                txtEstado.innerText = textoEspecial;
                txtEstado.style.color = "orange";
                txtCaudal.innerText = "0";
            } else {
                if (activo) {
                    txtEstado.style.color = "green";
                    txtCaudal.innerText = "15";
                } else {
                    txtEstado.innerText = "Apagado";
                    txtEstado.style.color = "red";
                    txtCaudal.innerText = "0";
                }
            }
        }

        function mandarFetchCentral(orden) {
            fetch(`http://localhost:8082/regar?orden=${encodeURIComponent(orden)}`)
                .catch(err => log(`[ERROR] HTTP: No se alcanzó la Central local. ${err}`));
        }

        function cambiarEstado(activo) {
            if (activo && riegoActivo) return;
            if (!activo && !riegoActivo) return;

            const est = document.getElementById('estacionSelect').value;
            const segs = document.getElementById('inputSegundos').value;

            if (activo) {
                mandarFetchCentral(`${est}#${segs}`);
            } else {
                mandarFetchCentral(`${est}#STOP`);
            }
        }

        function toggleFuga() {
            const est = document.getElementById('estacionSelect').value;
            mandarFetchCentral(`${est}#FUGA`);
        }

        function procesarSiguientePeticion() {
            const area = document.getElementById('txtPeticiones');
            const lineas = area.value.split('\n').filter(l => l.trim() !== '');
            if (lineas.length === 0) { log('[WM_FO] No hay peticiones.'); return; }

            const siguiente = lineas.shift();
            area.value = lineas.join('\n');
            log(`[WM_FO] Extrayendo orden de la cola: "${siguiente}"`);
            mandarFetchCentral(siguiente);
        }

        function sincronizarConKafka() {
            fetch('http://localhost:8082/eventos')
                .then(res => res.text())
                .then(texto => {
                    if (!texto.trim()) return;
                    const lineas = texto.trim().split('\n');

                    if (primeraCarga) {
                        const ultimaLinea = lineas[lineas.length - 1].split('|');
                        ultimoEventoId = parseInt(ultimaLinea[0]);
                        primeraCarga = false;
                        return;
                    }

                    lineas.forEach(linea => {
                        const partes = linea.split('|');
                        if (partes.length >= 3) {
                            const id = parseInt(partes[0]);
                            const tipo = partes[1];
                            const contenido = partes.slice(2).join('|');

                            if (id > ultimoEventoId) {
                                ultimoEventoId = id;

                                if (tipo === 'ORDEN') {
                                    const [estacion, accion] = contenido.split('#');

                                    if (estacion && ['WS-01', 'WS-02', 'WS-03'].includes(estacion)) {
                                        document.getElementById('estacionSelect').value = estacion;
                                    }

                                    if (accion === 'STOP') {
                                        clearInterval(intervaloTimer); // Frenamos el cronómetro
                                        log(`🛑 [KAFKA] La estación ${estacion} ha DETENIDO el riego.`);
                                        actualizarUIEstado(false);
                                    } else if (accion === 'FUGA') {
                                        clearInterval(intervaloTimer);
                                        fugaActiva = !fugaActiva;
                                        log(`⚠️ [KAFKA] Fuga en ${estacion} ${fugaActiva ? 'PROVOCADA' : 'REPARADA'}.`);
                                        actualizarUIEstado(false, fugaActiva ? "ALERTA FUGA" : "Apagado (Fuga Arreglada)");
                                    } else {
                                        const segundos = parseInt(accion);
                                        log(`💧 [KAFKA] RIEGO INICIADO en ${estacion} por ${segundos}s.`);
                                        actualizarUIEstado(true);

                                        // LA MAGIA: LA CUENTA ATRÁS VISUAL Y EL STOP AUTOMÁTICO
                                        let s = segundos;
                                        clearInterval(intervaloTimer);
                                        document.getElementById('txtEstado').innerText = `EN RIEGO (${s}s restantes)`;

                                        intervaloTimer = setInterval(() => {
                                            s--;
                                            if (s > 0) {
                                                if (riegoActivo) {
                                                    document.getElementById('txtEstado').innerText = `EN RIEGO (${s}s restantes)`;
                                                }
                                            } else {
                                                clearInterval(intervaloTimer);
                                                if (riegoActivo) {
                                                    log(`⏳ [TIMER] Tiempo finalizado. Ejecutando STOP automático.`);
                                                    mandarFetchCentral(`${estacion}#STOP`);
                                                }
                                            }
                                        }, 1000);
                                    }
                                } else if (tipo === 'RESUMEN') {
                                    clearInterval(intervaloTimer);
                                    log(`✅ [KAFKA-RESUMEN] Riego registrado: ${contenido}`);
                                    actualizarUIEstado(false);
                                }
                            }
                        }
                    });
                }).catch(err => { });
        }

        setInterval(sincronizarConKafka, 1500);
        function limpiarLog() { document.getElementById('logConsole').value = ''; }
        log("[INICIO] Sistema listo. Temporizador sincronizado con red Kafka.");
    </script>
</body>
</html>
